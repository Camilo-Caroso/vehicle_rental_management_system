<table class="w-full text-sm">
    <thead>
        <tr class="text-left text-gray-500 border-b">
            <th class="pb-2">Vehicle</th>
            <th class="pb-2">Issue</th>
            <th class="pb-2">Status</th>
            <th class="pb-2">Reported</th>
        </tr>
    </thead>
    <tbody>
        {% for record in records %}
        <tr class="border-b last:border-0">
            <td class="py-2">{{ record.vehicle.make }} {{ record.vehicle.model }}</td>
            <td class="py-2">{{ record.issue_type }}</td>
            <td class="py-2">{{ record.status }}</td>
            <td class="py-2">{{ record.reported_datetime }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="4" class="py-2 text-gray-400">No records found.</td></tr>
        {% endfor %}
    </tbody>
</table>

<a href="/dashboard/maintenance-records/" class="text-sm text-blue-500 hover:underline mt-2 block">View All →</a>
