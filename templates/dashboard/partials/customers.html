<table class="w-full text-sm">
    <thead>
        <tr class="text-left text-gray-500 border-b">
            <th class="pb-2">Name</th>
            <th class="pb-2">Email</th>
            <th class="pb-2">Phone</th>
        </tr>
    </thead>
    <tbody>
        {% for customer in customers %}
        <tr class="border-b last:border-0">
            <td class="py-2">{{ customer.first_name }} {{ customer.last_name }}</td>
            <td class="py-2">{{ customer.email }}</td>
            <td class="py-2">{{ customer.phone }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="3" class="py-2 text-gray-400">No customers found.</td></tr>
        {% endfor %}
    </tbody>
</table>
<a href="/dashboard/customers/" class="text-sm text-blue-500 hover:underline mt-2 block">View All →</a>
