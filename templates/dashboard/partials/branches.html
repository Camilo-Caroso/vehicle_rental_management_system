<table class="w-full text-sm">
    <thead>
        <tr class="text-left text-gray-500 border-b">
            <th class="pb-2">Name</th>
            <th class="pb-2">Address</th>
            <th class="pb-2">Phone</th>
        </tr>
    </thead>
    <tbody>
        {% for branch in branches %}
        <tr class="border-b last:border-0 py-2">
            <td class="py-2">{{ branch.name }}</td>
            <td class="py-2">{{ branch.address }}</td>
            <td class="py-2">{{ branch.phone }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="3" class="py-2 text-gray-400">No branches found.</td></tr>
        {% endfor %}
    </tbody>
</table>
<a href="/dashboard/branches/" class="text-sm text-blue-500 hover:underline mt-2 block">View All →</a>
