<div id="create-vehicle-type-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded shadow-lg p-6 w-full max-w-md">
        <div class="flex items-center justify-between mb-4">
            <h3 class="font-bold text-lg">New Vehicle Type</h3>
            <button onclick="document.getElementById('create-vehicle-type-modal').classList.add('hidden')"
                    class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
        </div>

        <form method="POST" action="/dashboard/vehicle-types/create/">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Type Name</label>
                <input type="text" name="type_name" required
                       class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex justify-end gap-2">
                <button type="button"
                        onclick="document.getElementById('create-vehicle-type-modal').classList.add('hidden')"
                        class="text-sm px-4 py-2 rounded border hover:bg-gray-50">Cancel</button>
                <button type="submit"
                        class="text-sm px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700">Create</button>
            </div>
        </form>
    </div>
</div>
