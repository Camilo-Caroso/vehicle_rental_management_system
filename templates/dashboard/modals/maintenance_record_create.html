<div id="create-record-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded shadow-lg p-6 w-full max-w-md overflow-y-auto max-h-screen">
        <div class="flex items-center justify-between mb-4">
            <h3 class="font-bold text-lg">New Maintenance Record</h3>
            <button onclick="document.getElementById('create-record-modal').classList.add('hidden')"
                    class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
        </div>

        <form method="POST" action="/dashboard/maintenance-records/create/">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Vehicle</label>
                <select name="vehicle_id" required
                        class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    {% for vehicle in vehicles %}
                    <option value="{{ vehicle.vehicle_id }}">{{ vehicle.make }} {{ vehicle.model }} — {{ vehicle.license_plate }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Reporting Customer (optional)</label>
                <select name="reporting_customer_id"
                        class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">— None —</option>
                    {% for customer in customers %}
                    <option value="{{ customer.customer_id }}">{{ customer.first_name }} {{ customer.last_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Assigned Staff (optional)</label>
                <select name="assigned_staff_id"
                        class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">— None —</option>
                    {% for staff in staff_list %}
                    <option value="{{ staff.staff_id }}">{{ staff.first_name }} {{ staff.last_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Reported DateTime</label>
                <input type="datetime-local" name="reported_datetime" required
                       class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Issue Type</label>
                <select name="issue_type" required
                        class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="Routine">Routine</option>
                    <option value="Urgent">Urgent</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                <textarea name="description" required rows="3"
                          class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                <select name="status" required
                        class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="Reported">Reported</option>
                    <option value="InProgress">In Progress</option>
                    <option value="Complete">Complete</option>
                    <option value="AwaitingParts">Awaiting Parts</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Notes (optional)</label>
                <textarea name="notes" rows="3"
                          class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Resolved DateTime (optional)</label>
                <input type="datetime-local" name="resolved_datetime"
                       class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex justify-end gap-2">
                <button type="button"
                        onclick="document.getElementById('create-record-modal').classList.add('hidden')"
                        class="text-sm px-4 py-2 rounded border hover:bg-gray-50">Cancel</button>
                <button type="submit"
                        class="text-sm px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700">Create</button>
            </div>
        </form>
    </div>
</div>
