<div id="create-rental-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded shadow-lg p-6 w-full max-w-md overflow-y-auto max-h-screen">
        <div class="flex items-center justify-between mb-4">
            <h3 class="font-bold text-lg">New Rental Agreement</h3>
            <button onclick="document.getElementById('create-rental-modal').classList.add('hidden')"
                    class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
        </div>

        <form method="POST" action="/dashboard/rental-agreements/create/">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Customer</label>
                <select name="customer_id" required
                        class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    {% for customer in customers %}
                    <option value="{{ customer.customer_id }}">{{ customer.first_name }} {{ customer.last_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Vehicle</label>
                <select name="vehicle_id" required
                        class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    {% for vehicle in vehicles %}
                    <option value="{{ vehicle.vehicle_id }}">{{ vehicle.make }} {{ vehicle.model }} — {{ vehicle.license_plate }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Pickup Branch</label>
                <select name="pickup_branch_id" required
                        class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    {% for branch in branches %}
                    <option value="{{ branch.branch_id }}">{{ branch.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Return Branch</label>
                <select name="return_branch_id" required
                        class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    {% for branch in branches %}
                    <option value="{{ branch.branch_id }}">{{ branch.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Scheduled Pickup</label>
                <input type="datetime-local" name="scheduled_pickup_datetime" required
                       class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Scheduled Return</label>
                <input type="datetime-local" name="scheduled_return_datetime" required
                       class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Actual Pickup</label>
                <input type="datetime-local" name="actual_pickup_datetime" required
                       class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Actual Return</label>
                <input type="datetime-local" name="actual_return_datetime" required
                       class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Estimated Cost</label>
                <input type="number" step="0.01" name="estimated_cost" required
                       class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Actual Cost</label>
                <input type="number" step="0.01" name="actual_cost" required
                       class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                <select name="status" required
                        class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="Booked">Booked</option>
                    <option value="Active">Active</option>
                    <option value="Completed">Completed</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
            </div>
            <div class="flex justify-end gap-2">
                <button type="button"
                        onclick="document.getElementById('create-rental-modal').classList.add('hidden')"
                        class="text-sm px-4 py-2 rounded border hover:bg-gray-50">Cancel</button>
                <button type="submit"
                        class="text-sm px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700">Create</button>
            </div>
        </form>
    </div>
</div>
